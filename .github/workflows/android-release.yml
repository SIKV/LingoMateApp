name: Android release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build signed APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > android_keystore.jks

      - name: Create secrets.properties
        env:
          SENTRY_DSN_ANDROID: ${{ secrets.SENTRY_DSN_ANDROID }}
          POSTHOG_PROJECT_TOKEN: ${{ secrets.POSTHOG_PROJECT_TOKEN }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > secrets.properties <<EOF
          sentryDSNAndroid=$SENTRY_DSN_ANDROID

          posthogProjectToken=$POSTHOG_PROJECT_TOKEN
          posthogHost=$POSTHOG_HOST

          androidKeystoreFile=android_keystore.jks
          androidKeystorePassword=$ANDROID_KEYSTORE_PASSWORD
          androidKeyAlias=$ANDROID_KEY_ALIAS
          androidKeyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Check lint
        run: ./gradlew :composeApp:lintRelease

      - name: Build with Gradle
        run: ./gradlew :composeApp:assembleRelease

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lingomate-release.apk
          path: composeApp/build/outputs/apk/release/composeApp-release.apk
          if-no-files-found: error
