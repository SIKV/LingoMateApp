name: Publish remote config

on:
  push:
    branches: [main]
    paths: ["resources/config/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m json.tool resources/config/v1/remote_config.json > /dev/null
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: resources/config
      - id: deploy
        uses: actions/deploy-pages@v4
